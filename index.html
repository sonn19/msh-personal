<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),pointer={x:0,y:0,active:false};let w,h,stars=[],mode='orbit',hue=242,paused=false,t=0,opened=false,idleTimer;const TAU=Math.PI*2,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){w=innerWidth;h=innerHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(600,Math.max(200,Math.floor(w*h/1100)))},()=>({a:Math.random()*TAU,r:Math.sqrt(Math.random()),z:Math.random(),seed:Math.random()*100,speed:.35+Math.random()*.8,size:.25+Math.random()*1.5,x:Math.random()*w,y:Math.random()*h}))}
